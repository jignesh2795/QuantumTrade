[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumtrade"
version = "0.1.0"
description = "QuantumTrade - AI-powered trading platform"
authors = [
    {name = "QuantumTrade Team"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "flask>=2.3.2",
    "flask-cors>=4.0.0",
    "flask-jwt-extended>=4.5.2",
    "sqlalchemy>=2.0.15",
    "psycopg2-binary>=2.9.6",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "numpy>=1.24.3",
    "pandas>=2.0.2",
    "scikit-learn>=1.2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.3.0",
    "flake8>=6.0.0",
    "mypy>=1.3.0"
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
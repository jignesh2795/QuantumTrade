[tool.poetry]
name = "quantumtrade"
version = "0.1.0"
description = "AI-driven trading platform"
authors = ["QuantumTrade Team"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.1"
uvicorn = {version = "^0.23.2", extras = ["standard"]}
sqlalchemy = "^2.0.22"
psycopg2-binary = "^2.9.7"
pydantic = "^2.6.0"
python-dotenv = "^1.0.1"
pytest = "^8.2.1"
pytest-asyncio = "^0.22.0"
requests = "^2.32.1"
numpy = "^1.26.2"
pandas = "^2.1.1"
aiohttp = "^3.9.3"
pyjwt = "^2.8.0"
passlib = "^1.7.4"
bcrypt = "^4.1.2"
prometheus-client = "^0.19.0"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# Production docker-compose.yml with enhanced configuration

version: "3.9"

services:
  # Backend service
  backend:
    build:
      context: ../
      dockerfile: docker/backend.Dockerfile
      target: production
    volumes:
      - backend_logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://quantumtrade:quantumtrade@postgres:5432/quantumtrade
      - PYTHONPATH=/app
      - APP_ENV=production
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - quantumtrade-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Frontend service
  frontend:
    build:
      context: ../
      dockerfile: docker/frontend.Dockerfile
      target: production
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=/api
    restart: unless-stopped
    networks:
      - quantumtrade-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # PostgreSQL database
  postgres:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=quantumtrade
      - POSTGRES_USER=quantumtrade
      - POSTGRES_PASSWORD=quantumtrade
    restart: unless-stopped
    networks:
      - quantumtrade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumtrade"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis for caching
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - quantumtrade-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../infrastructure/nginx/conf.d:/etc/nginx/conf.d
      - frontend_dist:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - quantumtrade-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:v2.40.0
    volumes:
      - ../infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - quantumtrade-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana-enterprise:9.3.0
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - quantumtrade-network

volumes:
  backend_logs:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  frontend_dist:

networks:
  quantumtrade-network:
    driver: bridge
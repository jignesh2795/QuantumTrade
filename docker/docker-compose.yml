# Development docker-compose.yml with enhanced configuration

version: "3.9"

services:
  # Backend service
  backend:
    build:
      context: ../
      dockerfile: docker/backend.Dockerfile
      target: production
    volumes:
      - ../backend/src:/app/src
      - backend_logs:/app/logs
      - backend_cache:/root/.local
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://quantumtrade:quantumtrade@postgres:5432/quantumtrade
      - PYTHONPATH=/app
      - APP_ENV=development
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - quantumtrade-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend service
  frontend:
    build:
      context: ../
      dockerfile: docker/frontend.Dockerfile
      target: build
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - frontend_cache:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped
    networks:
      - quantumtrade-network
    command: ["npm", "run", "dev"]

  # PostgreSQL database
  postgres:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=quantumtrade
      - POSTGRES_USER=quantumtrade
      - POSTGRES_PASSWORD=quantumtrade
    restart: unless-stopped
    networks:
      - quantumtrade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumtrade"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - quantumtrade-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:v2.40.0
    volumes:
      - ../infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - quantumtrade-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana-enterprise:9.3.0
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - quantumtrade-network

volumes:
  backend_logs:
  backend_cache:
  frontend_cache:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  quantumtrade-network:
    driver: bridge
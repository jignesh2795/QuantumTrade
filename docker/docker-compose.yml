# Development docker-compose.yml
version: "3.9"

services:
  backend:
    build:
      context: ../
      dockerfile: docker/backend.Dockerfile.dev
    volumes:
      - ../backend/src:/app/src
      - backend_cache:/root/.cache/pip
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    command: ["uvicorn", "src.api.server:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ../
      dockerfile: docker/frontend.Dockerfile.dev
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - frontend_cache:/app/node_modules
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_cache:
  frontend_cache:
<!DOCTYPE html>
<html>
<head>
    <title>Frontend-Backend Test</title>
</head>
<body>
    <h1>Frontend-Backend Communication Test</h1>
    <button id="testButton">Test Communication</button>
    <div id="results"></div>

    <script>
        document.getElementById('testButton').addEventListener('click', async () => {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                // Test strategy signal endpoint
                const signalResponse = await fetch('http://localhost:8000/strategy/signal?symbol=BTC-USD');
                const signalData = await signalResponse.json();
                resultsDiv.innerHTML += `<p>Signal: ${JSON.stringify(signalData)}</p>`;
                
                // Test portfolio list endpoint
                const portfolioResponse = await fetch('http://localhost:8000/portfolio/list');
                const portfolioData = await portfolioResponse.json();
                resultsDiv.innerHTML += `<p>Portfolio: ${JSON.stringify(portfolioData)}</p>`;
                
                // Test risk assessment endpoint
                const riskResponse = await fetch('http://localhost:8000/risk/assess?position_size=1500&account_balance=10000');
                const riskData = await riskResponse.json();
                resultsDiv.innerHTML += `<p>Risk: ${JSON.stringify(riskData)}</p>`;
                
                resultsDiv.innerHTML += '<p style="color: green;">All tests passed!</p>';
            } catch (error) {
                resultsDiv.innerHTML += `<p style="color: red;">Test failed: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>

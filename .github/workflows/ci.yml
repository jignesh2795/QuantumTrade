name: QuantumTrade CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [created]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run backend tests
      run: |
        cd backend
        python -m pytest tests/ -v
    
    - name: Run backend unit tests
      run: |
        cd backend
        python -m pytest tests/unit/ -v
    
    - name: Run backend integration tests
      run: |
        cd backend
        python -m pytest tests/integration/ -v

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run frontend tests
      run: |
        cd frontend
        npm test -- --watchAll=false || echo "No frontend tests configured"
    
  build-docker:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
    - uses: actions/checkout@v3
    
    - name: Build backend Docker image
      run: |
        docker build -f docker/backend.Dockerfile -t quantumtrade-backend .
    
    - name: Build frontend Docker image
      run: |
        docker build -f docker/frontend.Dockerfile -t quantumtrade-frontend .
    
    - name: Run Docker containers
      run: |
        docker-compose -f docker/docker-compose.yml up -d
        sleep 30  # Wait for containers to start
    
    - name: Test Docker containers health
      run: |
        docker-compose -f docker/docker-compose.yml ps
        # Add health check tests here
    
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/develop'
    steps:
    - name: Deploy to staging environment
      run: |
        echo "Deploying to staging environment"
        # Add staging deployment commands here
    
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.event_name == 'release'
    steps:
    - name: Deploy to production environment
      run: |
        echo "Deploying to production environment"
        # Add production deployment commands here